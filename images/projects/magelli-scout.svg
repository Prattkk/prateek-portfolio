<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0f0520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c481ff"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c481ff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="12" ry="12" fill="url(#bg)" stroke="#c481ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Outer glow ring -->
  <circle cx="400" cy="195" r="125" fill="url(#iconGrad)" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="400" cy="195" r="85" fill="none" stroke="url(#accent)" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="6,4"/>
  <!-- Multi-agent network: center hub -->
  <circle cx="400" cy="195" r="18" fill="#c481ff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="400" cy="195" r="22" fill="none" stroke="#c481ff" stroke-width="1.5" opacity="0.5"/>
  <!-- Agent nodes -->
  <circle cx="330" cy="145" r="11" fill="#8b5cf6" opacity="0.85"/>
  <circle cx="470" cy="145" r="11" fill="#8b5cf6" opacity="0.85"/>
  <circle cx="310" cy="215" r="10" fill="#a78bfa" opacity="0.75"/>
  <circle cx="490" cy="215" r="10" fill="#a78bfa" opacity="0.75"/>
  <circle cx="360" cy="255" r="9" fill="#c4b5fd" opacity="0.65"/>
  <circle cx="440" cy="255" r="9" fill="#c4b5fd" opacity="0.65"/>
  <!-- Connection lines -->
  <line x1="400" y1="195" x2="330" y2="145" stroke="#c481ff" stroke-width="1.5" opacity="0.45"/>
  <line x1="400" y1="195" x2="470" y2="145" stroke="#c481ff" stroke-width="1.5" opacity="0.45"/>
  <line x1="400" y1="195" x2="310" y2="215" stroke="#c481ff" stroke-width="1.2" opacity="0.35"/>
  <line x1="400" y1="195" x2="490" y2="215" stroke="#c481ff" stroke-width="1.2" opacity="0.35"/>
  <line x1="400" y1="195" x2="360" y2="255" stroke="#c481ff" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="195" x2="440" y2="255" stroke="#c481ff" stroke-width="1" opacity="0.3"/>
  <!-- Cross-agent connections -->
  <line x1="330" y1="145" x2="310" y2="215" stroke="#8b5cf6" stroke-width="0.8" opacity="0.2"/>
  <line x1="470" y1="145" x2="490" y2="215" stroke="#8b5cf6" stroke-width="0.8" opacity="0.2"/>
  <!-- Award badge -->
  <rect x="620" y="38" width="148" height="28" rx="14" fill="#c481ff" opacity="0.15" stroke="#c481ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="694" y="57" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c481ff" opacity="0.9" letter-spacing="0.5">🏆 1ST PLACE · BUILDATHON</text>
  <!-- Decorative dots -->
  <circle cx="150" cy="100" r="3" fill="#c481ff" opacity="0.25"/>
  <circle cx="650" cy="120" r="4" fill="#8b5cf6" opacity="0.2"/>
  <circle cx="120" cy="380" r="3" fill="#8b5cf6" opacity="0.2"/>
  <circle cx="680" cy="400" r="5" fill="#c481ff" opacity="0.15"/>
  <!-- Project name -->
  <text x="400" y="368" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" letter-spacing="1">Magelli Scout</text>
  <!-- Category -->
  <text x="400" y="403" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#c481ff" opacity="0.85" letter-spacing="3">AI PROSPECT INTELLIGENCE</text>
  <!-- Bottom accent line -->
  <rect x="300" y="428" width="200" height="2" rx="1" fill="url(#accent)" opacity="0.35"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1200"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900"/>
      <stop offset="100%" style="stop-color:#e07b00"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#FF9900;stop-opacity:0.06"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bg)" stroke="#FF9900" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- grid -->
  <g opacity="0.04">
    <line x1="0" y1="90" x2="800" y2="90" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="270" x2="800" y2="270" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="450" stroke="#fff" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="450" stroke="#fff" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="450" stroke="#fff" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="450" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Pipeline connector lines -->
  <line x1="133" y1="175" x2="193" y2="175" stroke="#FF9900" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="5,3"/>
  <line x1="253" y1="175" x2="313" y2="175" stroke="#FF9900" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="5,3"/>
  <line x1="373" y1="175" x2="433" y2="175" stroke="#FF9900" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="5,3"/>
  <line x1="493" y1="175" x2="553" y2="175" stroke="#FF9900" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="5,3"/>
  <!-- Arrow heads -->
  <polygon points="193,170 203,175 193,180" fill="#FF9900" opacity="0.7"/>
  <polygon points="313,170 323,175 313,180" fill="#FF9900" opacity="0.7"/>
  <polygon points="433,170 443,175 433,180" fill="#FF9900" opacity="0.7"/>
  <polygon points="553,170 563,175 553,180" fill="#FF9900" opacity="0.7"/>

  <!-- Node 1: Kinesis -->
  <rect x="73" y="145" width="60" height="60" rx="10" fill="url(#nodeGrad)" stroke="#FF9900" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="103" y="166" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700" fill="#FF9900" opacity="0.9">KINESIS</text>
  <!-- wave icon -->
  <path d="M86,178 Q91,172 96,178 Q101,184 106,178 Q111,172 116,178" fill="none" stroke="#FF9900" stroke-width="1.8" opacity="0.8"/>
  <text x="103" y="198" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#FF9900" opacity="0.6">Ingest</text>

  <!-- Node 2: Lambda -->
  <rect x="203" y="145" width="60" height="60" rx="10" fill="url(#nodeGrad)" stroke="#FF9900" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="233" y="166" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700" fill="#FF9900" opacity="0.9">LAMBDA</text>
  <!-- lambda symbol -->
  <text x="233" y="185" text-anchor="middle" font-family="serif" font-size="18" font-weight="700" fill="#FF9900" opacity="0.75">λ</text>
  <text x="233" y="198" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#FF9900" opacity="0.6">Transform</text>

  <!-- Node 3: S3 -->
  <rect x="323" y="145" width="60" height="60" rx="10" fill="url(#nodeGrad)" stroke="#FF9900" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="353" y="166" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FF9900" opacity="0.9">S3</text>
  <!-- bucket icon -->
  <ellipse cx="353" cy="179" rx="12" ry="5" fill="none" stroke="#FF9900" stroke-width="1.5" opacity="0.7"/>
  <line x1="341" y1="179" x2="341" y2="192" stroke="#FF9900" stroke-width="1.5" opacity="0.7"/>
  <line x1="365" y1="179" x2="365" y2="192" stroke="#FF9900" stroke-width="1.5" opacity="0.7"/>
  <path d="M341,192 Q353,197 365,192" fill="none" stroke="#FF9900" stroke-width="1.5" opacity="0.7"/>
  <text x="353" y="208" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#FF9900" opacity="0.6">Data Lake</text>

  <!-- Node 4: Glue -->
  <rect x="443" y="145" width="60" height="60" rx="10" fill="url(#nodeGrad)" stroke="#FF9900" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="473" y="166" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700" fill="#FF9900" opacity="0.9">GLUE</text>
  <!-- gear icon simplified -->
  <circle cx="473" cy="181" r="8" fill="none" stroke="#FF9900" stroke-width="1.5" opacity="0.7"/>
  <circle cx="473" cy="181" r="3" fill="#FF9900" opacity="0.5"/>
  <text x="473" y="198" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#FF9900" opacity="0.6">ETL</text>

  <!-- Node 5: Athena -->
  <rect x="563" y="145" width="60" height="60" rx="10" fill="url(#nodeGrad)" stroke="#FF9900" stroke-width="1.5" stroke-opacity="0.7"/>
  <text x="593" y="166" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="700" fill="#FF9900" opacity="0.9">ATHENA</text>
  <!-- SQL query icon -->
  <text x="593" y="184" text-anchor="middle" font-family="monospace" font-size="10" fill="#FF9900" opacity="0.7">SQL</text>
  <text x="593" y="198" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="8" fill="#FF9900" opacity="0.6">Query</text>

  <!-- Phase labels below -->
  <text x="103" y="230" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" opacity="0.35" letter-spacing="0.5">Phase 1</text>
  <text x="233" y="230" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" opacity="0.35" letter-spacing="0.5">Phase 2</text>
  <text x="353" y="230" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" opacity="0.35" letter-spacing="0.5">Phase 3</text>
  <text x="473" y="230" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" opacity="0.35" letter-spacing="0.5">Phase 4a</text>
  <text x="593" y="230" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fff" opacity="0.35" letter-spacing="0.5">Phase 4b</text>

  <!-- Step Functions badge -->
  <rect x="638" y="145" width="95" height="28" rx="6" fill="#FF9900" opacity="0.1" stroke="#FF9900" stroke-width="1" stroke-opacity="0.4"/>
  <text x="685" y="163" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#FF9900" opacity="0.8">Step Functions</text>
  <rect x="638" y="177" width="95" height="28" rx="6" fill="#FF9900" opacity="0.1" stroke="#FF9900" stroke-width="1" stroke-opacity="0.4"/>
  <text x="685" y="195" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#FF9900" opacity="0.8">Orchestration</text>

  <!-- Decorative dots -->
  <circle cx="50" cy="60" r="3" fill="#FF9900" opacity="0.2"/>
  <circle cx="720" cy="80" r="4" fill="#FF9900" opacity="0.15"/>
  <circle cx="40" cy="390" r="3" fill="#FF9900" opacity="0.2"/>
  <circle cx="750" cy="400" r="5" fill="#FF9900" opacity="0.15"/>

  <!-- Project name -->
  <text x="400" y="310" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="1">UrbanFleet AWS Pipeline</text>
  <!-- Category -->
  <text x="400" y="342" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#FF9900" opacity="0.85" letter-spacing="3">REAL-TIME DATA ENGINEERING</text>
  <!-- Bottom accent -->
  <rect x="300" y="368" width="200" height="2" rx="1" fill="url(#awsOrange)" opacity="0.4"/>
</svg>

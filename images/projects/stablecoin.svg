<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="sc-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="12" fill="url(#sc-bg)" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#06b6d4" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/><line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/><line x1="640" y1="0" x2="640" y2="500"/>
  </g>
  <!-- Chain links -->
  <g opacity="0.15">
    <ellipse cx="300" cy="200" rx="55" ry="30" fill="none" stroke="url(#sc-accent)" stroke-width="3"/>
    <ellipse cx="370" cy="200" rx="55" ry="30" fill="none" stroke="url(#sc-accent)" stroke-width="3"/>
    <ellipse cx="440" cy="200" rx="55" ry="30" fill="none" stroke="url(#sc-accent)" stroke-width="3"/>
    <ellipse cx="510" cy="200" rx="55" ry="30" fill="none" stroke="url(#sc-accent)" stroke-width="3"/>
  </g>
  <!-- Coin symbol -->
  <circle cx="400" cy="200" r="70" fill="none" stroke="url(#sc-accent)" stroke-width="2" opacity="0.25"/>
  <circle cx="400" cy="200" r="50" fill="none" stroke="url(#sc-accent)" stroke-width="1.5" opacity="0.15"/>
  <text x="400" y="215" font-family="system-ui, sans-serif" font-size="40" font-weight="700" fill="#06b6d4" text-anchor="middle" opacity="0.4">$</text>
  <!-- Trend line -->
  <polyline points="150,310 230,295 300,305 370,275 430,260 500,265 570,240 650,245" fill="none" stroke="url(#sc-accent)" stroke-width="2.5" opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150" cy="310" r="4" fill="#06b6d4" opacity="0.5"/>
  <circle cx="300" cy="305" r="4" fill="#06b6d4" opacity="0.5"/>
  <circle cx="430" cy="260" r="4" fill="#06b6d4" opacity="0.5"/>
  <circle cx="570" cy="240" r="4" fill="#06b6d4" opacity="0.5"/>
  <circle cx="650" cy="245" r="4" fill="#06b6d4" opacity="0.5"/>
  <!-- Title -->
  <text x="400" y="400" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Stablecoin Analytics (PYUSD)</text>
  <text x="400" y="430" font-family="system-ui, sans-serif" font-size="14" fill="#06b6d4" text-anchor="middle" opacity="0.8" letter-spacing="3">BLOCKCHAIN &amp; FINANCIAL MODELING</text>
  <!-- Bottom accent line -->
  <rect x="300" y="460" width="200" height="2" rx="1" fill="url(#sc-accent)" opacity="0.4"/>
</svg>

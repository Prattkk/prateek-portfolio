<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="12" ry="12" fill="url(#bg)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Decorative circle -->
  <circle cx="400" cy="195" r="120" fill="url(#iconGrad)" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Bar chart icon -->
  <g transform="translate(310, 120)">
    <!-- Chart base line -->
    <line x1="20" y1="160" x2="180" y2="160" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
    <line x1="20" y1="160" x2="20" y2="20" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
    <!-- Bars -->
    <rect x="35" y="110" width="25" height="50" rx="3" fill="#f59e0b" opacity="0.5"/>
    <rect x="70" y="70" width="25" height="90" rx="3" fill="#f59e0b" opacity="0.65"/>
    <rect x="105" y="90" width="25" height="70" rx="3" fill="#d97706" opacity="0.55"/>
    <rect x="140" y="40" width="25" height="120" rx="3" fill="#f59e0b" opacity="0.8"/>
    <!-- Trend line -->
    <polyline points="47,105 82,65 117,82 152,35" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <!-- Dots on trend -->
    <circle cx="47" cy="105" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="82" cy="65" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="117" cy="82" r="3" fill="#fbbf24" opacity="0.8"/>
    <circle cx="152" cy="35" r="3" fill="#fbbf24" opacity="0.8"/>
  </g>
  <!-- Star ratings decorative -->
  <g transform="translate(320, 275)" opacity="0.4">
    <polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9" fill="#f59e0b"/>
    <polygon points="42,2 45,9 52,9 46,14 48,21 42,17 36,21 38,14 32,9 39,9" fill="#f59e0b"/>
    <polygon points="72,2 75,9 82,9 76,14 78,21 72,17 66,21 68,14 62,9 69,9" fill="#f59e0b"/>
    <polygon points="102,2 105,9 112,9 106,14 108,21 102,17 96,21 98,14 92,9 99,9" fill="#f59e0b"/>
    <polygon points="132,2 135,9 142,9 136,14 138,21 132,17 126,21 128,14 122,9 129,9" fill="#f59e0b" opacity="0.4"/>
  </g>
  <!-- Small decorative dots -->
  <circle cx="150" cy="100" r="3" fill="#f59e0b" opacity="0.3"/>
  <circle cx="650" cy="120" r="4" fill="#d97706" opacity="0.2"/>
  <circle cx="120" cy="380" r="3" fill="#d97706" opacity="0.25"/>
  <circle cx="680" cy="400" r="5" fill="#f59e0b" opacity="0.2"/>
  <!-- Project name -->
  <text x="400" y="370" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" letter-spacing="1">Yelp Restaurant Analytics</text>
  <!-- Category -->
  <text x="400" y="405" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#f59e0b" opacity="0.8" letter-spacing="3">DATA ENGINEERING</text>
  <!-- Bottom accent line -->
  <rect x="300" y="430" width="200" height="2" rx="1" fill="url(#accent)" opacity="0.3"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071a10"/>
      <stop offset="100%" style="stop-color:#0a0008"/>
    </linearGradient>
    <linearGradient id="spotifyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1DB954"/>
      <stop offset="100%" style="stop-color:#14833b"/>
    </linearGradient>
    <linearGradient id="barcaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A50044"/>
      <stop offset="100%" style="stop-color:#7a0033"/>
    </linearGradient>
    <linearGradient id="neutralGray" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#888888;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#555555;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="12" fill="url(#bg)" stroke="#1DB954" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Grid -->
  <g opacity="0.04">
    <line x1="0" y1="90" x2="800" y2="90" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="270" x2="800" y2="270" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="450" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="450" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Baseline axis -->
  <line x1="110" y1="230" x2="690" y2="230" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  <!-- Zero label -->
  <text x="96" y="234" text-anchor="end" font-family="monospace" font-size="10" fill="#fff" opacity="0.3">0</text>

  <!-- Sentiment bars — 5 categories -->
  <!-- 1: Stadium rename -70.8% (red, below baseline) -->
  <rect x="130" y="230" width="70" height="88" rx="3" fill="url(#barcaRed)" opacity="0.85"/>
  <text x="165" y="328" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#A50044" opacity="0.9">−70.8%</text>

  <!-- 2: Deal announce +1.4% (green, above baseline — tiny) -->
  <rect x="230" y="218" width="70" height="12" rx="3" fill="url(#spotifyGreen)" opacity="0.8"/>
  <text x="265" y="244" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#1DB954" opacity="0.9">+1.4%</text>

  <!-- 3: Spotify CAR +4.15% (green) -->
  <rect x="330" y="195" width="70" height="35" rx="3" fill="url(#spotifyGreen)" opacity="0.75"/>
  <text x="365" y="244" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#1DB954" opacity="0.9">+4.15%</text>

  <!-- 4: Spain Search #1 (neutral) -->
  <rect x="430" y="165" width="70" height="65" rx="3" fill="url(#neutralGray)" opacity="0.9"/>
  <text x="465" y="244" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#aaa" opacity="0.9">Spain #1</text>

  <!-- 5: MAU growth +5.27% (green) -->
  <rect x="530" y="187" width="70" height="43" rx="3" fill="url(#spotifyGreen)" opacity="0.7"/>
  <text x="565" y="244" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#1DB954" opacity="0.9">5.27%</text>

  <!-- X-axis labels -->
  <text x="165" y="345" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" opacity="0.45">Stadium</text>
  <text x="165" y="356" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" opacity="0.45">Rename</text>
  <text x="265" y="256" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" opacity="0.45">Deal</text>
  <text x="265" y="267" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" opacity="0.45">Announce</text>
  <text x="365" y="256" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" opacity="0.45">Spotify</text>
  <text x="365" y="267" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" opacity="0.45">CAR</text>
  <text x="465" y="256" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" opacity="0.45">Search</text>
  <text x="465" y="267" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" opacity="0.45">Interest</text>
  <text x="565" y="256" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" opacity="0.45">MAU</text>
  <text x="565" y="267" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#fff" opacity="0.45">Growth</text>

  <!-- RoBERTa badge -->
  <rect x="30" y="40" width="140" height="26" rx="13" fill="#1DB954" opacity="0.12" stroke="#1DB954" stroke-width="1" stroke-opacity="0.5"/>
  <text x="100" y="57" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#1DB954" opacity="0.9">RoBERTa · 58M tweets</text>

  <!-- Medium badge -->
  <rect x="630" y="40" width="130" height="26" rx="13" fill="#A50044" opacity="0.12" stroke="#A50044" stroke-width="1" stroke-opacity="0.5"/>
  <text x="695" y="57" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#A50044" opacity="0.9">Published on Medium</text>

  <!-- Brand color split divider -->
  <rect x="380" y="100" width="2" height="140" rx="1" fill="#ffffff" opacity="0.06"/>

  <!-- Decorative dots -->
  <circle cx="50" cy="380" r="3" fill="#1DB954" opacity="0.2"/>
  <circle cx="740" cy="60" r="4" fill="#A50044" opacity="0.2"/>
  <circle cx="730" cy="390" r="3" fill="#1DB954" opacity="0.15"/>

  <!-- Project name -->
  <text x="400" y="305" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="0.5">Spotify × FC Barcelona</text>
  <text x="400" y="332" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#ffffff" opacity="0.7" letter-spacing="0.5">Sentiment Analysis</text>
  <!-- Category -->
  <text x="400" y="362" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#1DB954" opacity="0.8" letter-spacing="3">MARKETING ANALYTICS · NLP</text>
  <!-- Bottom accent — dual color -->
  <rect x="260" y="385" width="140" height="2" rx="1" fill="url(#spotifyGreen)" opacity="0.5"/>
  <rect x="400" y="385" width="140" height="2" rx="1" fill="url(#barcaRed)" opacity="0.5"/>
</svg>

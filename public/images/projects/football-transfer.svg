<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="12" ry="12" fill="url(#bg)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Decorative circle -->
  <circle cx="400" cy="195" r="120" fill="url(#iconGrad)" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Soccer ball -->
  <circle cx="400" cy="190" r="50" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.7"/>
  <circle cx="400" cy="190" r="48" fill="#ef4444" opacity="0.1"/>
  <!-- Pentagon pattern on ball -->
  <polygon points="400,155 418,167 412,188 388,188 382,167" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
  <polygon points="400,225 382,213 388,192 412,192 418,213" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>
  <line x1="400" y1="155" x2="400" y2="140" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>
  <line x1="418" y1="167" x2="435" y2="158" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>
  <line x1="382" y1="167" x2="365" y2="158" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>
  <line x1="418" y1="213" x2="435" y2="222" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>
  <line x1="382" y1="213" x2="365" y2="222" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>
  <!-- Transfer arrows -->
  <g opacity="0.4">
    <line x1="290" y1="180" x2="330" y2="180" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <polygon points="330,175 340,180 330,185" fill="#f87171"/>
    <line x1="510" y1="200" x2="470" y2="200" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <polygon points="470,195 460,200 470,205" fill="#f87171"/>
  </g>
  <!-- Data points around -->
  <g opacity="0.3">
    <rect x="280" y="140" width="30" height="4" rx="2" fill="#ef4444"/>
    <rect x="280" y="150" width="20" height="4" rx="2" fill="#ef4444"/>
    <rect x="490" y="220" width="30" height="4" rx="2" fill="#ef4444"/>
    <rect x="490" y="230" width="25" height="4" rx="2" fill="#ef4444"/>
  </g>
  <!-- Small decorative dots -->
  <circle cx="150" cy="100" r="3" fill="#ef4444" opacity="0.3"/>
  <circle cx="650" cy="120" r="4" fill="#dc2626" opacity="0.2"/>
  <circle cx="120" cy="380" r="3" fill="#dc2626" opacity="0.25"/>
  <circle cx="680" cy="400" r="5" fill="#ef4444" opacity="0.2"/>
  <!-- Project name -->
  <text x="400" y="365" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="1">European Football Transfer BI</text>
  <!-- Category -->
  <text x="400" y="400" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#f87171" opacity="0.8" letter-spacing="3">SPORTS ANALYTICS</text>
  <!-- Bottom accent line -->
  <rect x="300" y="425" width="200" height="2" rx="1" fill="url(#accent)" opacity="0.3"/>
</svg>
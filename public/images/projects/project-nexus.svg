<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#071020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.04"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="12" ry="12" fill="url(#bg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Background glow ring -->
  <circle cx="400" cy="190" r="125" fill="url(#iconGrad)" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Financial bar chart (strategy / revenue model visual) -->
  <!-- Bar 1 -->
  <rect x="308" y="215" width="28" height="55" rx="3" fill="url(#barGrad)" opacity="0.55"/>
  <!-- Bar 2 -->
  <rect x="348" y="195" width="28" height="75" rx="3" fill="url(#barGrad)" opacity="0.65"/>
  <!-- Bar 3 -->
  <rect x="388" y="170" width="28" height="100" rx="3" fill="url(#barGrad)" opacity="0.8"/>
  <!-- Bar 4 (tallest = $13.7M) -->
  <rect x="428" y="145" width="28" height="125" rx="3" fill="url(#barGrad)" opacity="0.9"/>
  <!-- Bar 5 -->
  <rect x="468" y="180" width="28" height="90" rx="3" fill="url(#barGrad)" opacity="0.7"/>
  <!-- Trend line over bars -->
  <polyline points="322,210 362,190 402,163 442,140 482,174" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trend line dots -->
  <circle cx="322" cy="210" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="362" cy="190" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="402" cy="163" r="4" fill="#38bdf8" opacity="0.8"/>
  <circle cx="442" cy="140" r="5" fill="#38bdf8" opacity="0.95"/>
  <circle cx="482" cy="174" r="4" fill="#38bdf8" opacity="0.7"/>
  <!-- Drone icon (top right of chart area) -->
  <g transform="translate(530, 110)" opacity="0.7">
    <!-- Drone body -->
    <rect x="-12" y="-7" width="24" height="14" rx="4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Arms -->
    <line x1="-12" y1="-7" x2="-28" y2="-20" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="12" y1="-7" x2="28" y2="-20" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="-12" y1="7" x2="-28" y2="20" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="12" y1="7" x2="28" y2="20" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Rotors -->
    <ellipse cx="-28" cy="-20" rx="10" ry="4" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <ellipse cx="28" cy="-20" rx="10" ry="4" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <ellipse cx="-28" cy="20" rx="10" ry="4" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <ellipse cx="28" cy="20" rx="10" ry="4" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- KPI label: $13.7M -->
  <text x="442" y="132" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" opacity="0.9">$13.7M</text>
  <!-- Award badge -->
  <rect x="620" y="38" width="148" height="28" rx="14" fill="#38bdf8" opacity="0.1" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
  <text x="694" y="57" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" opacity="0.9" letter-spacing="0.5">🏆 1ST PLACE · CASE COMP</text>
  <!-- Decorative dots -->
  <circle cx="150" cy="100" r="3" fill="#38bdf8" opacity="0.25"/>
  <circle cx="650" cy="120" r="4" fill="#0284c7" opacity="0.2"/>
  <circle cx="120" cy="380" r="3" fill="#0284c7" opacity="0.2"/>
  <circle cx="680" cy="400" r="5" fill="#38bdf8" opacity="0.15"/>
  <!-- Project name -->
  <text x="400" y="368" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" letter-spacing="1">Project Nexus</text>
  <!-- Category -->
  <text x="400" y="403" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#38bdf8" opacity="0.85" letter-spacing="3">WALMART SMART COMMERCE</text>
  <!-- Bottom accent line -->
  <rect x="300" y="428" width="200" height="2" rx="1" fill="url(#accent)" opacity="0.35"/>
</svg>
